events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    # 60m clears a 50 MB model upload (.spz splats) + multipart overhead.
    client_max_body_size 60m;

    server {
        listen 80;
        server_name localhost;

        # Static uploads
        location /uploads/ {
            alias /var/www/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Static 3D models
        location /models/ {
            alias /var/www/models/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # API proxy — no trailing slash, so the /api prefix is preserved
        # and the backend mounts routes at /api/*.
        location /api/ {
            proxy_pass http://api:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Built SPA (copied into this image by nginx/Dockerfile)
        location / {
            root /var/www/frontend;
            try_files $uri $uri/ /index.html;
        }
    }
}
